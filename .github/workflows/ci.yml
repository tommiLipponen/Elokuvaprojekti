name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholder only - prisma.config.ts resolves DATABASE_URL eagerly (even for
      # `prisma generate`, which needs no real connection). Real migrations use the
      # DATABASE_URL secret set explicitly in the deploy step below.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      TEST_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      JWT_SECRET: "ci-access-token-secret"
      JWT_REFRESH_SECRET: "ci-refresh-token-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx prisma migrate deploy

      - run: npm test

      # Only Topi (migration owner) applies migrations to the shared Azure DB.
      # Requires a DATABASE_URL repo secret pointing at Azure Postgres.
      - name: Deploy migrations to Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npx prisma migrate deploy
          else
            echo "DATABASE_URL secret not set yet - skipping migrate deploy"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

