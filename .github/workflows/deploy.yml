name: Deploy to Azure App Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into backend/public
        run: |
          rm -rf backend/public
          cp -r frontend/dist backend/public

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend
        working-directory: backend
        run: npm test

      # Deploy to Azure App Service (migrations already deployed by CI workflow)
      # app-name must be the actual App Service resource name, not the auto-generated hostname
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: moviedb
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/

      # Verify deployed app is responding
      - name: Smoke test deployed app
        run: |
          echo "Waiting for app to start..."
          sleep 5
          curl -f https://moviedb-eqgbbphehffnerf7.francecentral-01.azurewebsites.net/api-docs || exit 1
          echo "✅ App is running and Swagger UI is accessible"
